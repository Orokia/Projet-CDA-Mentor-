# Analyse SonarQube (job "sonarqube" de .github/workflows/build.yml)
# La clé doit correspondre au projet créé sur le serveur SonarQube.
sonar.projectKey=mentor
sonar.projectName=Mentor

sonar.sources=src,templates,assets
sonar.tests=tests
# Paquets JS téléchargés par importmap:install
sonar.exclusions=assets/vendor/**
sonar.sourceEncoding=UTF-8
