# Analyse SonarQube Cloud (job "sonarqube" de .github/workflows/build.yml)
# Les clés doivent correspondre au projet créé sur sonarcloud.io
# (Project → Information).
sonar.organization=orokia
sonar.projectKey=Orokia_Projet-CDA-Mentor
sonar.projectName=Mentor

sonar.sources=src,templates,assets
sonar.tests=tests
# Paquets JS téléchargés par importmap:install
sonar.exclusions=assets/vendor/**
sonar.sourceEncoding=UTF-8

# Rapports produits par l'étape "Tests with coverage" du job sonarqube
sonar.php.coverage.reportPaths=var/test-reports/coverage.xml
sonar.php.tests.reportPath=var/test-reports/junit.xml

# Mêmes exclusions que <source> dans phpunit.dist.xml (non mesurés par PHPUnit),
# plus les fixtures, qui ne sont pas du code applicatif, et le JavaScript
# (contrôleurs Stimulus) : aucun lanceur de tests JS dans le projet, donc aucun
# rapport de couverture possible. Ces fichiers restent analysés (bugs, failles).
sonar.coverage.exclusions=src/Entity/**,src/Kernel.php,src/DataFixtures/**,assets/**
