# Analyse SonarQube Cloud (job "sonarqube" de .github/workflows/build.yml)
# Les clés doivent correspondre au projet créé sur sonarcloud.io
# (Project → Information).
sonar.organization=orokia
sonar.projectKey=Orokia_Projet-CDA-Mentor-
sonar.projectName=Mentor

sonar.sources=src,templates,assets
sonar.tests=tests
# Paquets JS téléchargés par importmap:install
sonar.exclusions=assets/vendor/**
sonar.sourceEncoding=UTF-8
