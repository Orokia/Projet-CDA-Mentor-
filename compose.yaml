
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mentor_app
    restart: unless-stopped
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://mentor:mentor_dev_password@database:3306/mentor?serverVersion=8.0.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
    volumes:
      - .:/var/www/html
      - mentor_vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    networks:
      - mentor

  nginx:
    image: nginx:alpine
    container_name: mentor_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - mentor_vendor:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mentor

  database:
    image: mysql:8.0
    container_name: mentor_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mentor
      MYSQL_USER: mentor
      MYSQL_PASSWORD: mentor_dev_password
      MYSQL_ROOT_PASSWORD: mentor_root_dev_password
    ports:
      - "3307:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - mentor_mysql_data:/var/lib/mysql
    networks:
      - mentor

  mailer:
    image: axllent/mailpit
    container_name: mentor_mailer
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - mentor

volumes:
  mentor_mysql_data:
    name: mentor_mentor_mysql_data
  mentor_vendor:

networks:
  mentor:
    driver: bridge

