symfonycasts_reset_password:
    request_password_repository: App\Repository\DemandeReinitialisationMotDePasseRepository
    # Lien valable 1 heure
    lifetime: 3600
    # Une seule demande par compte toutes les 15 minutes (limite les e-mails envoyés)
    throttle_limit: 900
    # Les demandes expirées sont supprimées à chaque nouvelle demande
    enable_garbage_collection: true
