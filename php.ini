; Lu uniquement par "symfony server:start" (ajouté au php.ini de WAMP).
; OPcache est désactivé dans WAMP : sans lui, chaque requête recompile Symfony (30 s et plus).
zend_extension=opcache
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Recommandé par "symfony local:check:requirements" sous Windows
realpath_cache_size=5M
realpath_cache_ttl=600
